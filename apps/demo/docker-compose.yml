name: heftra-demo

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: heftra
      POSTGRES_USER: heftra
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U heftra -d heftra']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  link-org:
    build: ./postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: heftra
      PGPASSWORD: ${DEMO_DB_PASSWORD}
      DEMO_CLERK_ORG_ID: ${DEMO_CLERK_ORG_ID:?set DEMO_CLERK_ORG_ID}
    entrypoint: ['demo-reset']
    command: ['link']
    restart: 'no'

  reset:
    build: ./postgres
    depends_on:
      link-org:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: heftra
      PGPASSWORD: ${DEMO_DB_PASSWORD}
      DEMO_CLERK_ORG_ID: ${DEMO_CLERK_ORG_ID}
      DEMO_RESET_AT: ${DEMO_RESET_AT:-03:00}
      TZ: Europe/Copenhagen
    entrypoint: ['demo-reset']
    command: ['schedule']
    restart: unless-stopped

  web-api:
    build:
      context: ../..
      dockerfile: apps/web-api/Dockerfile
    depends_on:
      link-org:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://heftra:${DEMO_DB_PASSWORD}@postgres:5432/heftra
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
      WEB_API_CORS_ORIGINS: ${DEMO_APP_URL:-https://demo.heftra.com}
      WEB_API_CREDENTIAL_ENC_KEY: ${DEMO_CREDENTIAL_KEY:?set DEMO_CREDENTIAL_KEY}
    expose:
      - '8100'
    restart: unless-stopped

  demo-erp:
    build: ./erp
    depends_on:
      link-org:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://heftra:${DEMO_DB_PASSWORD}@postgres:5432/heftra
      WEB_API_CREDENTIAL_ENC_KEY: ${DEMO_CREDENTIAL_KEY}
      DEMO_ERP_URL: http://demo-erp:8001
    expose:
      - '8001'
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        VITE_API_BASE_URL: ${DEMO_API_URL:-https://demo-api.heftra.com}
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
        VITE_DEMO_EMAIL: ${DEMO_LOGIN_EMAIL:-demo@heftra.com}
        VITE_DEMO_PASSWORD: ${DEMO_LOGIN_PASSWORD:?set DEMO_LOGIN_PASSWORD}
    environment:
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
    expose:
      - '3100'
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - web
      - web-api
    restart: unless-stopped

volumes:
  demo_pgdata:
