name: steelyard

services:
  mock-erp-api:
    build:
      context: apps/mock-erp
    ports:
      - "8000:8000"
    environment:
      MOCK_ERP_SEED: "42"
      MOCK_ERP_MONTHS: "12"
      MOCK_ERP_AVG_INVOICES: "15"
      MOCK_ERP_START_DATE: "2025-07-01"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: steelyard
      POSTGRES_USER: steelyard
      POSTGRES_PASSWORD: steelyard
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-steelyard}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-steelyard-dev-secret}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  rustfs_data:
